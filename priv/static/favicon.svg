<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Mirrors the in-app logo in AppSidebar.tsx: an ember-gradient rounded
       square with the lucide "Activity" glyph. Colors track the app theme
       (assets/css/app.css) and flip with the OS light/dark preference. -->
  <style>
    :root {
      --bg-top: #cc632d;
      --bg-bottom: #bf4300;
      --glyph: #fef9f1;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-top: #f68f55;
        --bg-bottom: #f17a2c;
        --glyph: #2b1405;
      }
    }
  </style>
  <defs>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" style="stop-color: var(--bg-top)" />
      <stop offset="1" style="stop-color: var(--bg-bottom)" />
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="30" height="30" rx="7" fill="url(#ember)" />
  <path
    d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"
    transform="translate(7 7) scale(0.75)"
    fill="none"
    stroke="var(--glyph)"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
</svg>
